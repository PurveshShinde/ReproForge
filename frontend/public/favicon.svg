<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#0b0f19" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="url(#cyberGrad)" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Code Bracket { -->
  <path d="M 21 16 C 16 16 16 22 16 26 C 16 29 13 31 11 32 C 13 33 16 35 16 38 C 16 42 16 48 21 48" 
        stroke="url(#neonGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Anvil Silhouette -->
  <!-- Top Flat Face and Horn -->
  <path d="M 25 24 L 46 24 C 50 24 54 26 56 29 L 46 29 L 45 35 C 44 41 46 44 50 46 L 25 46 C 29 44 31 41 30 35 L 29 29 L 25 29 Z" 
        fill="url(#cyberGrad)" fill-opacity="0.2" stroke="url(#cyberGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Circuit Trace Lines inside Anvil -->
  <path d="M 25 24 L 45 24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M 33 24 L 33 32 L 40 37" stroke="url(#neonGlow)" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="40" cy="37" r="2" fill="#38bdf8" />
  <path d="M 21 32 L 29 32" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Core Spark -->
  <polygon points="37,17 38.5,21 42.5,22.5 38.5,24 37,28 35.5,24 31.5,22.5 35.5,21" fill="#38bdf8" filter="url(#glow)" />
</svg>